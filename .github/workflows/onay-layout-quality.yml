name: Onay Belgesi Layout Quality

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/align_onay_columns.py'
      - '.github/workflows/onay-layout-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dogrutemin-onay-layout-quality
  cancel-in-progress: true

jobs:
  align-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply approval document center axis alignment
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python ./_tools/align_onay_columns.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore DogruTemin.Wpf/DogruTemin.Wpf.csproj
          dotnet restore DogruTemin.Tests/DogruTemin.Tests.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build DogruTemin.Wpf/DogruTemin.Wpf.csproj -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test DogruTemin.Tests/DogruTemin.Tests.csproj -c Release --no-restore

      - name: Commit verified layout changes
        shell: pwsh
        run: |
          git config user.name 'mcalimlier'
          git config user.email '123293878+mcalimlier@users.noreply.github.com'
          git add DogruTemin.Wpf/Services/OfficialDocumentService.cs DogruTemin.Tests/ApprovalDocumentLayoutTests.cs
          if (git diff --cached --quiet) {
            Write-Host 'Yeni layout değişikliği yok.'
          } else {
            git commit -m 'Onay Belgesinde tum dikey boluculeri merkez aksina hizala'
            git push
          }
