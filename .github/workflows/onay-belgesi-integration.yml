name: Onay Belgesi Integration

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/apply_onay_belgesi.ps1'
      - '.github/workflows/onay-belgesi-integration.yml'
      - 'RC1_DEGISIKLIK_NOTU.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dogrutemin-onay-belgesi-integration
  cancel-in-progress: true

jobs:
  apply-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply Onay Belgesi integration and verify
        shell: pwsh
        run: ./_tools/apply_onay_belgesi.ps1
