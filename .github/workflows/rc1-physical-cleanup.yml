name: RC1 Physical Cleanup

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/rc1-physical-cleanup.ps1'
      - '.github/workflows/rc1-physical-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: dogrutemin-rc1-physical-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: RC1 dalını al
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fiziksel kaynak temizliğini uygula
        shell: pwsh
        run: |
          $path = '.\_tools\rc1-physical-cleanup.ps1'
          $text = Get-Content $path -Raw -Encoding UTF8
          $old = '$code = Replace-LiteralOnce $code ''        LoadSettingsEditor();'' '''' ''boş ayar editörü çağrısı'''
          $new = '$code = $code.Replace(''        LoadSettingsEditor();'', '''')'
          if (-not $text.Contains($old)) { throw 'LoadSettingsEditor temizlik satırı bulunamadı.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))
          & $path

      - name: Kaldırılan kartların kalan kod bağlarını temizle
        shell: pwsh
        run: |
          $path = '.\DogruTemin.Wpf\MainWindow.xaml.cs'
          $code = Get-Content $path -Raw -Encoding UTF8
          $pdfAssignment = '            _lastPdfPath = dialog.FileName;'
          $pdfCount = ([regex]::Matches($code, [regex]::Escape($pdfAssignment))).Count
          if ($pdfCount -ne 2) { throw "Beklenen 2 eski Son PDF ataması yerine $pdfCount bulundu." }
          $code = $code.Replace($pdfAssignment, '')

          $comboPattern = '(?s)\s*private void AnyCombo_SelectionChanged\(object sender, SelectionChangedEventArgs e\)\s*\{\s*if \(!_suppressDirtyTracking\) MarkDirty\(\);\s*\}\s*'
          $comboMatches = [regex]::Matches($code, $comboPattern)
          if ($comboMatches.Count -ne 1) { throw "AnyCombo_SelectionChanged için beklenen 1 eşleşme yerine $($comboMatches.Count) bulundu." }
          $code = [regex]::Replace($code, $comboPattern, "`r`n`r`n    ", 1)

          [IO.File]::WriteAllText((Resolve-Path $path), $code, (New-Object System.Text.UTF8Encoding($false)))

      - name: XAML yapısını doğrula
        shell: pwsh
        run: |
          [xml](Get-Content .\DogruTemin.Wpf\MainWindow.xaml -Raw -Encoding UTF8) | Out-Null
          Write-Host 'MainWindow.xaml XML doğrulaması başarılı.'

      - name: Kaynak farkını doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check başarısız.' }
          git diff --stat

      - name: NuGet paketlerini yükle
        shell: pwsh
        run: |
          dotnet restore .\DogruTemin.Wpf\DogruTemin.Wpf.csproj
          dotnet restore .\DogruTemin.Tests\DogruTemin.Tests.csproj

      - name: Release derlemesini doğrula
        shell: pwsh
        run: dotnet build .\DogruTemin.Wpf\DogruTemin.Wpf.csproj -c Release --no-restore

      - name: Otomatik testleri doğrula
        shell: pwsh
        run: dotnet test .\DogruTemin.Tests\DogruTemin.Tests.csproj -c Release --no-restore

      - name: Temizliği RC1 dalına işle
        shell: pwsh
        run: |
          git config user.name 'mcalimlier'
          git config user.email '123293878+mcalimlier@users.noreply.github.com'
          git add DogruTemin.Wpf/MainWindow.xaml DogruTemin.Wpf/MainWindow.xaml.cs
          if (git diff --cached --quiet) { throw 'Temizlik değişikliği oluşmadı.' }
          git commit -m 'Ana ekran tekrarlarını ve ölü kodu fiziksel olarak temizle'
          git push origin HEAD:release/4.2.0-rc1
