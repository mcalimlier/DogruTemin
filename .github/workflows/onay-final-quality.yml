name: Onay Belgesi Final Quality

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/fix_official_onay.ps1'
      - '.github/workflows/onay-final-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dogrutemin-onay-final-quality
  cancel-in-progress: true

jobs:
  fix-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply final Onay Belgesi quality fix
        shell: pwsh
        run: ./_tools/fix_official_onay.ps1
