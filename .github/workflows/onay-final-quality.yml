name: Onay Belgesi Final Quality

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/apply_onay_required_rule.py'
      - '.github/workflows/onay-final-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dogrutemin-onay-final-quality
  cancel-in-progress: true

jobs:
  fix-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Apply Onay Belgesi required optional rule
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python ./_tools/apply_onay_required_rule.py

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore DogruTemin.Wpf/DogruTemin.Wpf.csproj
          dotnet restore DogruTemin.Tests/DogruTemin.Tests.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build DogruTemin.Wpf/DogruTemin.Wpf.csproj -c Release --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test DogruTemin.Tests/DogruTemin.Tests.csproj -c Release --no-restore

      - name: Commit verified source changes
        shell: pwsh
        run: |
          git config user.name 'mcalimlier'
          git config user.email '123293878+mcalimlier@users.noreply.github.com'
          git add DogruTemin.Core/Services/ValidationService.cs DogruTemin.Wpf/MainWindow.xaml DogruTemin.Tests/ValidationTests.cs
          if (git diff --cached --quiet) {
            Write-Host 'Kaynaklarda yeni değişiklik yok.'
          } else {
            git commit -m 'Onay Belgesinde referans doluluk kuralını uygula'
            git push
          }
