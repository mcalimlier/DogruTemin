name: RC1 Warning Cleanup

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/rc1-warning-cleanup.ps1'
      - '.github/workflows/rc1-warning-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: dogrutemin-rc1-warning-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: RC1 dalını al
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Analyzer düzeltmelerini uygula
        shell: pwsh
        run: |
          $scriptPath = '.\_tools\rc1-warning-cleanup.ps1'
          $script = Get-Content $scriptPath -Raw -Encoding UTF8
          $script = $script.Replace('function Write(', 'function WriteFile(')
          $script = $script.Replace('Write $p $t', 'WriteFile $p $t')

          $chainPattern = '(?s)    \$new=\$text\.Replace\(''_validation\.ValidateDraft\('', ''ValidationService\.ValidateDraft\(''\).*?\.Replace\(''new ValidationService\(\)\.ReadinessPercent\('', ''ValidationService\.ReadinessPercent\(''\)'
          $chainReplacement = @'
              $new=$text
              $new=$new.Replace('_validation.ValidateDraft(', 'ValidationService.ValidateDraft(')
              $new=$new.Replace('_validation.DateLogicWarnings(', 'ValidationService.DateLogicWarnings(')
              $new=$new.Replace('_validation.ValidateDocument(', 'ValidationService.ValidateDocument(')
              $new=$new.Replace('_validation.ReadinessPercent(', 'ValidationService.ReadinessPercent(')
              $new=$new.Replace('new ValidationService().ValidateDraft(', 'ValidationService.ValidateDraft(')
              $new=$new.Replace('new ValidationService().DateLogicWarnings(', 'ValidationService.DateLogicWarnings(')
              $new=$new.Replace('new ValidationService().ValidateDocument(', 'ValidationService.ValidateDocument(')
              $new=$new.Replace('new ValidationService().ReadinessPercent(', 'ValidationService.ReadinessPercent(')
          '@
          $matches = [regex]::Matches($script, $chainPattern)
          if ($matches.Count -ne 1) { throw "Static çağrı zinciri için beklenen 1 eşleşme yerine $($matches.Count) bulundu." }
          $script = [regex]::Replace($script, $chainPattern, $chainReplacement, 1)
          [IO.File]::WriteAllText((Resolve-Path $scriptPath), $script, (New-Object System.Text.UTF8Encoding($false)))
          & $scriptPath

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function PatchFile([string]$path, [scriptblock]$transform) {
            $full = Resolve-Path $path
            $text = [IO.File]::ReadAllText($full)
            $new = & $transform $text
            [IO.File]::WriteAllText($full, $new, $utf8)
          }

          # Test Dispose satırındaki literal newline kaçışını gerçek satır sonuna dönüştür.
          PatchFile '.\DogruTemin.Tests\StorageServiceTests.cs' {
            param($t)
            $t.Replace(' } catch { }`r`n        GC.SuppressFinalize(this);', " } catch { }`r`n        GC.SuppressFinalize(this);")
          }

          # ValidationService tamamen stateless; nesne üretimini kaldır.
          PatchFile '.\DogruTemin.Core\Services\ValidationService.cs' {
            param($t)
            $t=$t.Replace('public class ValidationService','public static class ValidationService')
            $t=$t.Replace('public IReadOnlyList<ValidationIssue> ValidateWorkflow(','public static IReadOnlyList<ValidationIssue> ValidateWorkflow(')
            $t
          }

          # ProcurementEngine de tamamen stateless hesap motoru.
          PatchFile '.\DogruTemin.Core\Services\ProcurementEngine.cs' {
            param($t)
            $t=$t.Replace('public class ProcurementEngine','public static class ProcurementEngine')
            $t=$t.Replace('public CalculationResult Calculate(','public static CalculationResult Calculate(')
            $t
          }

          # Statik doğrulama/hesap çağrılarını bütün kaynakta uyumlu hale getir ve boş alanları kaldır.
          Get-ChildItem -Recurse -Filter '*.cs' | Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } | ForEach-Object {
            $t=[IO.File]::ReadAllText($_.FullName)
            $n=$t.Replace('_validation.ValidateWorkflow(', 'ValidationService.ValidateWorkflow(')
                 .Replace('new ValidationService().ValidateWorkflow(', 'ValidationService.ValidateWorkflow(')
                 .Replace('_engine.Calculate(', 'ProcurementEngine.Calculate(')
                 .Replace('new ProcurementEngine().Calculate(', 'ProcurementEngine.Calculate(')
                 .Replace('private readonly ValidationService _validation = new();', '')
                 .Replace('private readonly ProcurementEngine _engine = new();', '')
            if ($n -ne $t) { [IO.File]::WriteAllText($_.FullName,$n,$utf8) }
          }

          # Uygulama ortam bilgileri storage state'ine bağlı değil.
          PatchFile '.\DogruTemin.Wpf\Services\ApplicationSafetyService.cs' {
            param($t)
            $t=$t.Replace('public string CurrentVersion =>', 'public static string CurrentVersion =>')
            $t=$t.Replace('public string InformationalVersion =>', 'public static string InformationalVersion =>')
            $t=$t.Replace('public string RuntimeDescription =>', 'public static string RuntimeDescription =>')
            $t
          }
          PatchFile '.\DogruTemin.Wpf\DiagnosticPackageService.cs' {
            param($t)
            $t=$t.Replace('service.InformationalVersion', 'ApplicationSafetyService.InformationalVersion')
            $t=$t.Replace('service.RuntimeDescription', 'ApplicationSafetyService.RuntimeDescription')
            $t
          }

          # Kaldırılan instance bağımlılıkları ve son stateless onay helperı.
          PatchFile '.\DogruTemin.Wpf\MainWindow.xaml.cs' {
            param($t)
            $t=$t.Replace('_safety.CurrentVersion', 'ApplicationSafetyService.CurrentVersion')
            $t=$t.Replace('_safety.InformationalVersion', 'ApplicationSafetyService.InformationalVersion')
            $t=$t.Replace('_safety.RuntimeDescription', 'ApplicationSafetyService.RuntimeDescription')
            $t=$t.Replace('private bool ConfirmNonBlockingDocumentIssues(', 'private static bool ConfirmNonBlockingDocumentIssues(')
            $t
          }

          # Belge tablolarındaki sıra numaraları invariant kültürle yazılır.
          PatchFile '.\DogruTemin.Wpf\Services\OfficialDocumentService.cs' {
            param($t)
            $t.Replace('(i + 1).ToString()', '(i + 1).ToString(CultureInfo.InvariantCulture)')
          }

          # Yönetim raporunda sabit kolon dizileri tekrar üretilmez ve XML metinleri invariant provider kullanır.
          PatchFile '.\DogruTemin.Wpf\Services\ManagementReportService.cs' {
            param($t)
            $marker='    private static readonly CultureInfo Tr = CultureInfo.GetCultureInfo("tr-TR");'
            $fields=@'
              private static readonly CultureInfo Tr = CultureInfo.GetCultureInfo("tr-TR");
              private static readonly double[] SummaryColumnWidths = { 5.0, 26.0, 22.0, 22.0, 22.0, 22.0 };
              private static readonly double[] MonthlyColumnWidths = { 14.0, 15.0, 24.0 };
              private static readonly double[] DetailColumnWidths = { 7.0, 13.0, 18.0, 52.0, 22.0, 22.0, 22.0, 17.0 };
          '@
            $t=$t.Replace($marker,$fields.TrimEnd())
            $t=$t.Replace('SheetStart(new[] { 5.0, 26.0, 22.0, 22.0, 22.0, 22.0 })','SheetStart(SummaryColumnWidths)')
            $t=$t.Replace('SheetStart(new[] { 14.0, 15.0, 24.0 })','SheetStart(MonthlyColumnWidths)')
            $t=$t.Replace('SheetStart(new[] { 7.0, 13.0, 18.0, 52.0, 22.0, 22.0, 22.0, 17.0 })','SheetStart(DetailColumnWidths)')
            $t=$t.Replace('for (var i = 0; i < widths.Count; i++) sb.Append($"<col min=\"{i + 1}\" max=\"{i + 1}\" width=\"{widths[i].ToString("0.##", CultureInfo.InvariantCulture)}\" customWidth=\"1\"/>");','for (var i = 0; i < widths.Length; i++) sb.Append(CultureInfo.InvariantCulture, $"<col min=\"{i + 1}\" max=\"{i + 1}\" width=\"{widths[i].ToString("0.##", CultureInfo.InvariantCulture)}\" customWidth=\"1\"/>");')
            $t=$t.Replace('sb.Append($"</sheetData><autoFilter ref=\"A1:H{last}\"/>");','sb.Append(CultureInfo.InvariantCulture, $"</sheetData><autoFilter ref=\"A1:H{last}\"/>");')
            $t
          }

      - name: Kaynak farkını doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check başarısız.' }
          git diff --stat

      - name: NuGet paketlerini yükle
        shell: pwsh
        run: |
          dotnet restore .\DogruTemin.Wpf\DogruTemin.Wpf.csproj
          dotnet restore .\DogruTemin.Tests\DogruTemin.Tests.csproj

      - name: Release derlemesi yap ve sıfır uyarıyı doğrula
        shell: pwsh
        run: |
          $output = dotnet build .\DogruTemin.Wpf\DogruTemin.Wpf.csproj -c Release --no-restore 2>&1
          $output | Tee-Object -FilePath $env:RUNNER_TEMP\warning-cleanup-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release derlemesi başarısız.' }
          $summary = $output | Select-String -Pattern '^\s*\d+ Warning\(s\)' | Select-Object -Last 1
          Write-Host "DERLEME UYARI ÖZETİ: $summary"
          if ($summary -and $summary.Line -notmatch '^\s*0 Warning\(s\)') { throw "Uyarı temizliği tamamlanmadı: $($summary.Line)" }

      - name: Otomatik testleri çalıştır ve sıfır uyarıyı doğrula
        shell: pwsh
        run: |
          $output = dotnet test .\DogruTemin.Tests\DogruTemin.Tests.csproj -c Release --no-restore 2>&1
          $output | Tee-Object -FilePath $env:RUNNER_TEMP\warning-cleanup-test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Otomatik testler başarısız.' }
          $warnings = $output | Select-String -Pattern ': warning (CS|CA)\d+'
          if ($warnings) { $warnings | ForEach-Object { Write-Host $_ }; throw 'Test derlemesinde analyzer uyarısı kaldı.' }

      - name: Düzeltmeleri RC1 dalına işle
        shell: pwsh
        run: |
          git config user.name 'mcalimlier'
          git config user.email '123293878+mcalimlier@users.noreply.github.com'
          git add DogruTemin.Core DogruTemin.Wpf DogruTemin.Tests
          if (git diff --cached --quiet) { throw 'Analyzer temizliği değişikliği oluşmadı.' }
          git commit -m 'Analyzer uyarılarını sıfıra indir ve stateless kodu sadeleştir'
          git push origin HEAD:release/4.2.0-rc1
