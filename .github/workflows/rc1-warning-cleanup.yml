name: RC1 Warning Cleanup

on:
  push:
    branches:
      - release/4.2.0-rc1
    paths:
      - '_tools/rc1-warning-cleanup.ps1'
      - '.github/workflows/rc1-warning-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: dogrutemin-rc1-warning-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: RC1 dalını al
        uses: actions/checkout@v4
        with:
          ref: release/4.2.0-rc1
          fetch-depth: 0

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Analyzer düzeltmelerini uygula
        shell: pwsh
        run: |
          .\_tools\rc1-warning-cleanup.ps1
          $testPath = '.\DogruTemin.Tests\StorageServiceTests.cs'
          $test = Get-Content $testPath -Raw -Encoding UTF8
          $literal = ' } catch { }`r`n        GC.SuppressFinalize(this);'
          if ($test.Contains($literal)) {
            $test = $test.Replace($literal, " } catch { }`r`n        GC.SuppressFinalize(this);")
            [IO.File]::WriteAllText((Resolve-Path $testPath), $test, (New-Object System.Text.UTF8Encoding($false)))
          }

      - name: Kaynak farkını doğrula
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check başarısız.' }
          git diff --stat

      - name: NuGet paketlerini yükle
        shell: pwsh
        run: |
          dotnet restore .\DogruTemin.Wpf\DogruTemin.Wpf.csproj
          dotnet restore .\DogruTemin.Tests\DogruTemin.Tests.csproj

      - name: Release derlemesi yap ve uyarıları say
        shell: pwsh
        run: |
          $output = dotnet build .\DogruTemin.Wpf\DogruTemin.Wpf.csproj -c Release --no-restore 2>&1
          $output | Tee-Object -FilePath $env:RUNNER_TEMP\warning-cleanup-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release derlemesi başarısız.' }
          $summary = $output | Select-String -Pattern '^\s*\d+ Warning\(s\)' | Select-Object -Last 1
          Write-Host "DERLEME UYARI ÖZETİ: $summary"

      - name: Otomatik testleri çalıştır
        shell: pwsh
        run: dotnet test .\DogruTemin.Tests\DogruTemin.Tests.csproj -c Release --no-restore

      - name: Düzeltmeleri RC1 dalına işle
        shell: pwsh
        run: |
          git config user.name 'mcalimlier'
          git config user.email '123293878+mcalimlier@users.noreply.github.com'
          git add DogruTemin.Core DogruTemin.Wpf DogruTemin.Tests
          if (git diff --cached --quiet) { throw 'Analyzer temizliği değişikliği oluşmadı.' }
          git commit -m 'Analyzer uyarılarını gerçek kod düzeltmeleriyle azalt'
          git push origin HEAD:release/4.2.0-rc1
